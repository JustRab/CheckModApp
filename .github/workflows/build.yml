name: Build Windows executable

# Produces the two distributions users download. PyInstaller cannot
# cross-compile, so this must run on a Windows runner.
#
#   CheckMod.exe          one file, convenient, self-extracts to %TEMP%
#   CheckMod-folder.zip   one folder, corporate-friendly, no self-extraction
#   SHA256SUMS.txt        so IT can allow-list by hash instead of by exception
on:
  push:
    # Match both tagging conventions: "v1.0.0" and a bare "1.0.0".
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: CheckMod.exe
    runs-on: windows-latest
    env:
      # The `secrets` context is not available in a step-level `if`, so the
      # presence of a signing certificate is surfaced here as a plain string
      # the condition can read.
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.3"

      - name: Regenerate the icon
        run: python tools/make_icon.py

      - name: Run the logic tests
        run: |
          python -m pip install pytest
          python -m pytest tests/ -q --ignore=tests/test_gui_smoke.py

      - name: Build the one-file executable
        run: python -m PyInstaller packaging/CheckMod.spec --noconfirm --clean

      - name: Build the one-folder distribution
        run: >
          python -m PyInstaller packaging/CheckModFolder.spec
          --noconfirm --clean --distpath dist-folder

      # Signing removes the SmartScreen prompt and most heuristic antivirus
      # flags. It runs only when an organisation has supplied a certificate,
      # so forks and unsigned builds still work unchanged.
      - name: Sign the executables
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          foreach ($target in @("dist\CheckMod.exe", "dist-folder\CheckMod\CheckMod.exe")) {
            & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $target
          }
          Remove-Item $pfx -Force

      - name: Package the one-folder distribution
        shell: pwsh
        run: Compress-Archive -Path dist-folder\CheckMod -DestinationPath dist\CheckMod-folder.zip

      # One file a colleague can be handed directly - no repository access
      # needed, which is the point when the repo stays private. The README
      # text lives in packaging/share-readme.txt so it can be reviewed and
      # edited as prose rather than as embedded YAML.
      - name: Assemble the share bundle
        shell: pwsh
        run: |
          $version = (Select-String -Path checkmod/__init__.py `
                      -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $stage = "dist/bundle/CheckMod-$version"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse dist-folder/CheckMod "$stage/CheckMod"
          Copy-Item dist/CheckMod.exe "$stage/CheckMod-single-file.exe"
          Copy-Item docs/IT-APPROVAL.md "$stage/IT-APPROVAL.md"
          (Get-Content packaging/share-readme.txt -Raw).Replace('{VERSION}', $version) |
            Set-Content -Encoding UTF8 "$stage/README.txt"
          Compress-Archive -Path $stage -DestinationPath "dist/CheckMod-$version-share.zip"
          Remove-Item -Recurse -Force dist/bundle

      - name: Publish checksums
        shell: pwsh
        run: |
          # -Filter takes a single string, so it cannot be handed a list of
          # patterns; filter on the extension instead.
          $targets = Get-ChildItem -Path dist -File |
                     Where-Object { $_.Extension -eq '.exe' -or $_.Extension -eq '.zip' } |
                     Select-Object -ExpandProperty FullName
          $lines = foreach ($file in $targets) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            $size = "{0:N1} MB" -f ((Get-Item $file).Length / 1MB)
            "$hash  $(Split-Path $file -Leaf)  ($size)"
          }
          $lines | Tee-Object -FilePath dist\SHA256SUMS.txt

      - name: Upload the build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CheckMod-windows-portable
          path: |
            dist/CheckMod.exe
            dist/CheckMod-folder.zip
            dist/CheckMod-*-share.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach the build to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An array, not a space-separated string: the latter relies on word
          # splitting, which shellcheck flags (SC2086) and which breaks the
          # moment a path contains a space.
          files=(dist/CheckMod.exe dist/CheckMod-folder.zip dist/SHA256SUMS.txt)
          shopt -s nullglob
          files+=(dist/CheckMod-*-share.zip)
          gh release create "${GITHUB_REF_NAME}" \
            --title "CheckMod ${GITHUB_REF_NAME}" \
            --notes "Portable build - no installation and no administrator rights required.

          * **CheckMod.exe** - one file. Copy it anywhere and double-click.
          * **CheckMod-folder.zip** - one folder. Preferred on managed corporate
            machines: it does not extract itself to %TEMP% at launch, which is the
            behaviour heuristic antivirus most often flags. Unzip and run the exe inside.
          * **CheckMod-<version>-share.zip** - the whole thing in one file to hand
            to a colleague: both layouts, a plain-language README and the IT summary.
            Nobody needs repository access to use it.
          * **SHA256SUMS.txt** - hashes, so IT can allow-list the exact build.

          See docs/IT-APPROVAL.md for the summary an IT or security reviewer needs." \
            "${files[@]}" \
          || gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
