name: Tests

# The application has no runtime dependencies, so CI only needs Python, Tk and
# a virtual display to exercise the real interface.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tk and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb tk

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run the test suite (headless GUI included)
        run: xvfb-run -a python -m pytest tests/ -v

      - name: Byte-compile every module
        run: python -m compileall -q checkmod tools packaging

      # A workflow that only parses as YAML can still be rejected by GitHub -
      # a `secrets` reference in a step-level `if` did exactly that, silently
      # disabling the release build. actionlint checks expressions, contexts
      # and action inputs, so the same mistake fails here instead.
      - name: Lint the GitHub Actions workflows
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install actionlint-py
          actionlint .github/workflows/*.yml

      - name: Verify the icon generator still runs
        run: |
          python tools/make_icon.py --out /tmp/icon-check
          test -s /tmp/icon-check/icon.ico
          test -s /tmp/icon-check/icon.png
